<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    
    <title>Khamba game</title>

    <meta name="title" content="Khamba Game">
    <meta name="description" content="Khamba Game is a hilarious browser-based survival game where you play as a man on a mission to steal Electric Poles! Jump over speeding police cars, collect Khambas to score points, and see if you have the reflexes to avoid getting busted. Developed by @ridhwanscrap">
    
    <link rel="shortcut icon" href="./img/logo.png" type="image/x-icon">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        
        <div id="ui-layer">
            <div id="score-board">Khamba Stolen: <span id="score">0</span> ⚡</div>
            <div id="controls-hint">Tap or Space to Jump <span class="highLight">@ridhwanscrap</span>
            </div>
        </div>
        
        <div id="gameOverScreen">
            <h1>BUSTED!</h1>
            <p>You stole <span id="finalScore">0</span> Khamba</p>
            <button id="restartBtn">Run Again</button>
        </div>
    </div>

    <script src="script.js"></script> 
</body>
</html>
